[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tissue-patch-eval"
version = "0.1.0"
description = "Source-aware evaluation and image quality audit for public tissue patches"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "scipy>=1.14,<2", "scikit-learn>=1.5,<2", "h5py>=3.12,<4", "pillow>=11,<13", "markdown>=3.7,<4"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[project.scripts]
tissue-patch-eval = "tissue_patch_eval.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
